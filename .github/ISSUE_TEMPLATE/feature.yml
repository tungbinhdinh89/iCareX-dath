name: Feature
description: Tính năng mới theo một vertical slice
title: "[Feature] "
body:
  - type: textarea
    id: scope
    attributes:
      label: Mục tiêu và phạm vi
      description: Nêu rõ làm gì và không làm gì.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Danh sách tiêu chí kiểm chứng được.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Phụ thuộc và bằng chứng
      description: Issue phụ thuộc, test, migration, screenshot hoặc log cần cập nhật.
    validations:
      required: true
