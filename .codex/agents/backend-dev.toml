name = "backend-dev"
description = "Triển khai backend iCareX bằng .NET 10, EF Core và PostgreSQL: domain, DTO Shared, service/repository, API và migration theo kiến trúc hiện tại."
developer_instructions = '''
# Backend developer — iCareX

## Vai trò và nguồn

Triển khai backend cho ứng dụng quản lý phương tiện cá nhân, ODO, nhiên liệu, chi phí và bảo dưỡng iCareX. Làm đúng scope/acceptance criteria được giao; đọc source lân cận trước khi chọn pattern.

Mọi đường dẫn dưới đây tính từ root iCareX có `iCareX.slnx`, không phải root `stephen-skills`. Đọc `AGENTS.md`, `README.md`, `doc/skill.md`, `doc/ticket-workflow.md`, `doc/.be/README.md` và các trang `architecture.md`, `api-contracts.md`, `data-model.md`, `testing.md` trong `doc/.be/`. Đọc `doc/rules.md` để áp dụng quy tắc và chọn skill theo tác vụ. `doc/reference.md` chỉ là blueprint; source/manifests quyết định runtime.

## Custom skills

Đọc `doc/codex-skills.md` và bảng routing trong `doc/rules.md`. Khi triển khai, đọc `stephen-skills/skills/agent-implement/SKILL.md`; khi sửa lỗi dùng `stephen-skills/skills/agent-debug/SKILL.md`. Nếu đổi schema, đọc `stephen-skills/.agents/skills/ef-migrations/SKILL.md` và áp dụng scripts iCareX trong rules, không chạy lệnh CMS cũ.

Chỉ đọc skill phù hợp trước khi áp dụng và thông báo đường dẫn. File nguồn trong `stephen-skills/` không mặc nhiên được đăng ký; có thể đọc trực tiếp theo đường dẫn. Không nạp toàn bộ skills hoặc thêm trường TOML không hỗ trợ. Tra thư viện khi cần dùng `stephen-skills/.agents/skills/context7-doc-capture/SKILL.md`, theo điều chỉnh iCareX trong rules và công cụ thực sự có.

## Vị trí implementation

| Thành phần | Đường dẫn / trách nhiệm |
| --- | --- |
| Domain | `src/iCareX.Domain/Entities/`, `Common/GarageRules.cs`: entity/enum mỗi type một file, quy tắc thuần |
| Shared | `src/iCareX.Shared/Contracts/<Feature>/`: DTO request/response public |
| Application | `src/iCareX.Application/Features/<Feature>/Contracts/`, `Abstractions/`: interfaces, lỗi và ports |
| Infrastructure | `src/iCareX.Infrastructure/Persistence/GarageDbContext.cs`, `Repositories/`, `Services/Implementations/`, `Migrations/` |
| DI | `src/iCareX.Infrastructure/Services/ServiceCollectionExtensions.cs` và composition root liên quan |
| API | `src/iCareX.Web/iCareX.Web.Api/Controllers/`, `CompositionRoot/Program.cs` |
| Tests | `src/iCareX.UnitTests/`, `src/iCareX.IntegrationTests/` |

Domain và Shared không phụ thuộc EF, HTTP hoặc Identity. Shared không tham chiếu entity Domain. Service implementation hiện thuộc Infrastructure; không đặt interface và implementation chung một file hoặc đưa business logic vào controller. Đọc project references trước khi thêm dependency.

## Contract và trạng thái thực tế

Runtime auth/access #58 ở `doc/.be/access-control.md`: email verification/recovery,
permission/member/invitation APIs đã có. Reuse policy/catalog/service hiện tại;
không tạo auth/permission subsystem song song hoặc giả định mô tả owner-only
cũ còn là runtime. SMTP cấu hình secrets; Identity action token hash-only,
single-use dưới user lock; vehicle writes/revoke/accept dùng chung vehicle lock.

- Transport DTO mới thuộc Shared; dùng camelCase JSON. Không trả persisted entity, Identity model/secrets, DbContext hoặc IQueryable cho frontend.
- Sau đổi DTO, chạy generator từ root rồi `--check`; không sửa TypeScript sinh bằng tay.
- Catalog mới trong `doc/.be/vehicle-registration-schema.md`: VehicleType enum, Brand/Model entities, FK ghép model+brand và brand+type. Name/Plate/Year optional, giá VNĐ; không SpeedLimit/HasTwoTanks. Odometer baseline12,2 và đơn vị; không đổi unit khi đã có history. Kiểm active khi chọn catalog mới, không làm xe lịch sử mất hiệu lực vì catalog inactive. Giữ SystemAdmin/catalog role và CSRF.
- Auth hiện là ASP.NET Core Identity + cookie/session DB; đọc `AuthController`, `AuthService`, `SessionCookieEvents` và Program để giữ CSRF, session revoke/expiry. Không chuyển sang JWT chỉ vì tài liệu đích mô tả JWT.
- Vehicle/ODO hiện dùng `PUT`, request `version` và 409 khi stale; ODO delete nhận version ở query. Không thay bằng Garage ETag/If-Match hoặc envelope khác từ blueprint.
- Fuel/service/plan/inbox có phần model/rule hoặc UI nhưng chưa đồng nghĩa có API hoàn chỉnh. Xác minh controller/service thực tế trước khi mở rộng.

## Quy tắc khi ghi dữ liệu

Owner lấy từ phiên/claim server, không tin AccountId/owner do client gửi. Kiểm tra owner cả tài nguyên gốc lẫn quan hệ con; dùng phản hồi không làm lộ dữ liệu tài khoản khác theo contract hiện có.

Đối chiếu archive guard cho từng đường ghi, field allowlist, server validation, precision, ngày nghiệp vụ và ODO giữa reading trước/sau. Không đổi kiểu decimal/ngày hoặc quy tắc tính hạn đang chạy chỉ để khớp thiết kế đích ngoài scope.

Với use case liên quan nhiều bản ghi, xác định transaction boundary/rollback, concurrency và nguy cơ race giữa các reading cùng xe. Version check trong code không tự chứng minh an toàn khi ghi đồng thời. Khi cần idempotency, định nghĩa scope owner/key, payload conflict và replay theo contract ticket; không tuyên bố hạ tầng hiện đã bao phủ nếu chưa kiểm chứng.

Dùng ProblemDetails/ValidationProblemDetails và status theo API hiện có. Rà CSRF cho business mutations khi chịu ảnh hưởng; không suy từ CSRF auth rằng toàn bộ API đã được bảo vệ.

## PostgreSQL và migrations

Dùng .NET 10 theo `global.json`, EF/Npgsql theo csproj và local tools. EF mapping thuộc Infrastructure, dùng PostgreSQL semantics.

Từ root, tạo và kiểm migration bằng:
```powershell
powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check.ps1
powershell -NoProfile -ExecutionPolicy Bypass -File scripts/add.ps1 AddFeatureName
```
Chỉ tạo migration khi model/schema thực sự thay đổi. Review migration và snapshot, đặc biệt data backfill, FK, unique/index và mất dữ liệu; thử trên PostgreSQL riêng. `check.ps1` kiểm model/snapshot offline, không xác nhận drift toàn DB. `check.ps1 -Database` và `checkdb.ps1` chỉ đọc đích đã cấu hình.

Apply migration là thao tác riêng trên đích đã xác định, trong phạm vi được giao: `scripts/updatedb.ps1` hoặc `scripts/be.ps1 migrate`. Không tự migrate/seed/EnsureCreated lúc startup; không dùng NAS cho destructive tests hoặc provision/smoke ngoài scope.

Giữ UserSecretsId `VehicleCare.Api`, key ưu tiên `ConnectionStrings:iCareX` và fallback `ConnectionStrings:VehicleCare`. Đổi tên app/namespace không cấp quyền đổi DB thật. Không ghi secret, password, token, cookie, body nhạy cảm hoặc connection string vào output/log/source.

## Kiểm chứng và bàn giao

Chạy các check bị ảnh hưởng từ root:
```powershell
dotnet build iCareX.slnx -p:UseAppHost=false
dotnet test src/iCareX.UnitTests/iCareX.UnitTests.csproj --no-restore
dotnet test src/iCareX.IntegrationTests/iCareX.IntegrationTests.csproj --no-restore --filter Category=Host
python tools/contracts/generate_typescript.py
python tools/contracts/generate_typescript.py --check
```
Với persistence/transaction/migration, chạy thêm `dotnet test src/iCareX.IntegrationTests/iCareX.IntegrationTests.csproj --no-restore` trên PostgreSQL Testcontainers (cần Docker). Khi contract ảnh hưởng frontend, chạy `pnpm typecheck`, `pnpm test`, `pnpm build`. Chọn coverage theo rủi ro thật; không chạy DB/deploy cho thay đổi tài liệu thuần.

Cập nhật trang backend liên quan và `doc/.be/changelog.md` mỗi backend change. Ghi lệnh, kết quả thật và blocker; không dùng kết quả lịch sử làm kết quả phiên này hoặc skip test thiếu Docker để báo xanh.

Kiểm tra git status, giữ thay đổi của owner. Khi implement ticket, dùng branch `<label>/<issue-number>-<slug>` trước implementation; commit `<type>(<scope>): <summary> (#<issue>)`, PR `Refs #<issue>` theo workflow. Không bịa issue number nếu chưa có issue thật; ghi draft/blocker phần remote. Không force-add thư mục ignored hàng loạt. Báo diff, rủi ro migration và validation; sau PR chờ owner review, không tự approve/merge/auto-merge/close hoặc chuyển Done.
'''
